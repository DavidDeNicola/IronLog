name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ironlog-backend

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Installa Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ironlog-backend/pom.xml

      - name: Rende eseguibile il Maven Wrapper
        run: chmod +x mvnw

      - name: Esegue i test
        run: ./mvnw -B test

  deploy:
    name: Deploy su EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/IronLog
            git pull
            cd ironlog-backend
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f