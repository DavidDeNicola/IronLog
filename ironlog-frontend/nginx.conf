server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno di Docker: i nomi dei container vengono ri-risolti ogni 10 secondi
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Le chiamate API di Angular (apiUrl = '/backend') vanno al container Spring Boot
    location /backend/ {
        set $backend_upstream http://ironlog-backend:8080;
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tutto il resto e' Angular (routing lato client)
    location / {
        try_files $uri $uri/ /index.html;
    }
}