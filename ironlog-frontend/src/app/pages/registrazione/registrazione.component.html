<div class="pagina-registrazione">

  <div class="riquadro-registrazione">

    <div class="intestazione">
      <i class="bi bi-activity logo-icona"></i>
      <span class="logo-testo">IRONLOG</span>
    </div>

    <h1 class="titolo">Crea il tuo account</h1>
    <p class="sottotitolo">Bastano pochi secondi per iniziare a tracciare i tuoi allenamenti</p>

    <form (ngSubmit)="onSubmit()" #registrazioneForm="ngForm">

      <div class="selettore-ruolo">
        <button type="button"
                class="opzione-ruolo"
                [class.attiva]="atleta"
                (click)="selezionaRuolo('ATHLETE')">
          <i class="bi bi-person-arms-up"></i>
          <span>Atleta</span>
        </button>
        <button type="button"
                class="opzione-ruolo"
                [class.attiva]="!atleta"
                (click)="selezionaRuolo('COACH')">
          <i class="bi bi-clipboard2-pulse"></i>
          <span>Coach</span>
        </button>
      </div>

      <div class="riga">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" class="form-control"
                 [(ngModel)]="dati.nome" required autocomplete="given-name" />
        </div>
        <div class="campo">
          <label for="cognome">Cognome</label>
          <input type="text" id="cognome" name="cognome" class="form-control"
                 [(ngModel)]="dati.cognome" required autocomplete="family-name" />
        </div>
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control"
               [(ngModel)]="dati.email" required email autocomplete="email" />
      </div>

      <div class="campo">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control"
               [(ngModel)]="dati.password" required minlength="8" autocomplete="new-password" />
        <span class="nota">Almeno 8 caratteri</span>
      </div>

      <div class="campo">
        <label for="conferma">Conferma password</label>
        <input type="password" id="conferma" name="conferma" class="form-control"
               [(ngModel)]="confermaPassword" required autocomplete="new-password" />
      </div>

      @if (atleta && coach.length > 0) {
        <div class="campo">
          <label for="coach">Coach <span class="facoltativo">(facoltativo)</span></label>
          <select id="coach" name="coach" class="form-select" [(ngModel)]="dati.coachId">
            <option [ngValue]="null">Mi alleno da solo</option>
            @for (c of coach; track c.id) {
              <option [ngValue]="c.id">{{ c.nome }} {{ c.cognome }}</option>
            }
          </select>
          <span class="nota">Il coach potrà creare e seguire le tue schede</span>
        </div>
      }

      @if (errore) {
        <div class="messaggio-errore">{{ errore }}</div>
      }

      <button type="submit"
              class="btn btn-primary w-100"
              [disabled]="registrazioneForm.invalid || caricamento">
        {{ caricamento ? 'Creazione in corso...' : 'Crea account' }}
      </button>

    </form>

    <p class="rimando">
      Hai già un account? <a routerLink="/login">Accedi</a>
    </p>

  </div>

</div>
