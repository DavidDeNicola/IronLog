# Profilo usato solo dai test: database H2 in memoria al posto di MySQL
spring.datasource.url=jdbc:h2:mem:ironlog;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# data.sql e' scritto per MySQL: nei test non lo carichiamo
spring.sql.init.mode=never

# Valori finti, validi solo per i test
jwt.secret=chiave-di-test-lunga-almeno-32-caratteri-hmac
jwt.expiration-ms=3600000