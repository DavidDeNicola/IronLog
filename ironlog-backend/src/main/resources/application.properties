spring.application.name=ironlog

# --- Database ---------------------------------------------------------------
# Le credenziali arrivano da variabili d'ambiente: vedi il README.
spring.datasource.url=jdbc:mysql://localhost:3306/ironlog?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS}

# Lo schema viene ricreato a ogni avvio e ripopolato da data.sql: comodo per
# provare l'applicazione con dati realistici. Per conservare i dati tra un
# riavvio e l'altro imposta DDL_AUTO=update.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=${SQL_INIT:always}
spring.jpa.defer-datasource-initialization=true

# --- Sicurezza --------------------------------------------------------------
# JWT_SECRET deve essere lungo almeno 32 caratteri (firma HMAC-SHA256).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS -------------------------------------------------------------------
# Origini ammesse per il frontend Angular. Per provare l'app da un altro
# dispositivo sulla stessa rete aggiungi qui l'IP della tua macchina,
# per esempio: http://localhost:*,http://192.168.1.10:*
cors.allowed-origins=${CORS_ORIGINS:http://localhost:*}
