spring.application.name=ironlog

# --- Database ---------------------------------------------------------------
# Le credenziali arrivano da variabili d'ambiente: vedi il README.
spring.datasource.url=jdbc:mysql://localhost:3306/ironlog?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS}

# Lo schema viene ricreato a ogni avvio e ripopolato da data.sql: comodo per
# provare l'applicazione con dati realistici. Per conservare i dati tra un
# riavvio e l'altro imposta DDL_AUTO=update.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=${SQL_INIT:always}
spring.jpa.defer-datasource-initialization=true

# --- Sicurezza --------------------------------------------------------------
# JWT_SECRET deve essere lungo almeno 32 caratteri (firma HMAC-SHA256).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS -------------------------------------------------------------------
# Origini ammesse per il frontend Angular. Per provare l'app da un altro
# dispositivo sulla stessa rete aggiungi qui l'IP della tua macchina,
# per esempio: http://localhost:*,http://192.168.1.10:*
cors.allowed-origins=${CORS_ORIGINS:http://localhost:*}

# --- Nutrizione ---------------------------------------------------------------
# Soglie e step usati dal modulo Nutrizione per il target calorico per fase e
# per l'adattamento progressivo anti-stallo. Vedi CalcolatoreTargetFase e
# CalcolatoreAdattamentoProgressivo.
nutrizione.cut.soglia-bf-bassa-percent=12
nutrizione.cut.soglia-bf-alta-percent=18
nutrizione.cut.durata-mesi-breve=2
nutrizione.cut.durata-mesi-media=3
nutrizione.cut.durata-mesi-lunga=4
nutrizione.cut.adjustment-interval-days=14
nutrizione.cut.adjustment-step-kcal=75
nutrizione.cut.deficit-min-percent=15
nutrizione.cut.deficit-max-percent=25

nutrizione.bulk.adjustment-interval-days=21
nutrizione.bulk.adjustment-step-kcal=75
nutrizione.bulk.surplus-min-percent=10
nutrizione.bulk.surplus-max-percent=20

nutrizione.reverse-diet.adjustment-interval-days=7
nutrizione.reverse-diet.adjustment-step-kcal=75

nutrizione.mini-cut.deficit-min-percent=25
nutrizione.mini-cut.deficit-max-percent=30
nutrizione.mini-cut.durata-settimane-min=2
nutrizione.mini-cut.durata-settimane-max=4

nutrizione.diet-break.durata-settimane-min=1
nutrizione.diet-break.durata-settimane-max=2

nutrizione.macro.proteina-g-per-kg-min=1.6
nutrizione.macro.proteina-g-per-kg-max=2.2
nutrizione.macro.grassi-g-per-kg-min=0.8
nutrizione.macro.grassi-g-per-kg-max=1.0

# Ripartizione del target giornaliero tra i pasti (deve sommare a 100).
nutrizione.pasti.percentuale-colazione=25
nutrizione.pasti.percentuale-pranzo=35
nutrizione.pasti.percentuale-spuntino=10
nutrizione.pasti.percentuale-cena=30

# Soglie minime di sicurezza per le fasi in deficit calorico (CUT, MINI_CUT).
nutrizione.sicurezza.calorie-minime-femmina=1200
nutrizione.sicurezza.calorie-minime-maschio=1400
